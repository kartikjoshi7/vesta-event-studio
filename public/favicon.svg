<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1929"/>
      <stop offset="100%" stop-color="#0f0e17"/>
    </linearGradient>

    <!-- Luxury Gold/Iris Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6c177"/>
      <stop offset="50%" stop-color="#c4a7e7"/>
      <stop offset="100%" stop-color="#9ccfd8"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c4a7e7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9ccfd8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Inner Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="#c4a7e7" opacity="0.15" filter="url(#glow)"/>

  <!-- Vesta Sacred Hearth / Celebration Star Mark -->
  <g filter="url(#glow)">
    <!-- 8-Point Geometric Celebration Pavilion Star -->
    <path d="M32 10 L35.5 24.5 L48 21 L39.5 32 L48 43 L35.5 39.5 L32 54 L28.5 39.5 L16 43 L24.5 32 L16 21 L28.5 24.5 Z" 
          fill="url(#flameGrad)" 
          stroke="#ffffff" 
          stroke-width="0.75" 
          stroke-linejoin="round"/>

    <!-- Central Diamond Core Sparkle -->
    <path d="M32 22 L35 32 L32 42 L29 32 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M22 32 L32 35 L42 32 L32 29 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="32" r="3.5" fill="#f6c177"/>
    <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
  </g>
</svg>