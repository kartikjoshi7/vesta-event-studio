<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0e17"/>
      <stop offset="50%" stop-color="#161524"/>
      <stop offset="100%" stop-color="#0a0910"/>
    </linearGradient>

    <!-- Brand Gold-to-Iris Gradient -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6c177"/>
      <stop offset="50%" stop-color="#c4a7e7"/>
      <stop offset="100%" stop-color="#9ccfd8"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowGold" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f6c177" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIris" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c4a7e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowFoam" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#9ccfd8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9ccfd8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <rect width="1200" height="630" fill="url(#glowIris)"/>
  <rect width="1200" height="630" fill="url(#glowFoam)"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Top Category Tag -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#232136" stroke="#c4a7e7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="24" y="24" fill="#c4a7e7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">✦ CELEBRATION OS</text>

    <!-- Main Vesta Logo Mark (SVG Icon) -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="84" height="84" rx="22" fill="#1a1929" stroke="url(#brandGrad)" stroke-width="2"/>
      <!-- Sacred Star Icon -->
      <path d="M42 16 L46.5 33 L62 29 L51.5 42 L62 55 L46.5 51 L42 68 L37.5 51 L22 55 L32.5 42 L22 29 L37.5 33 Z" 
            fill="url(#brandGrad)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="42" cy="42" r="4" fill="#ffffff"/>
    </g>

    <!-- Brand Typography Header -->
    <text x="110" y="112" fill="url(#brandGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      VESTA EVENT STUDIO
    </text>
    <text x="110" y="142" fill="#9ccfd8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      Enterprise Celebration &amp; Event Planning Operating System
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="235" fill="#e0def4" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" line-height="38">
      Context-aware financial governance, dual-horizon timelines, vendor CRM,
    </text>
    <text x="0" y="275" fill="#e0def4" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400">
      and hybrid GenAI synthesis for Weddings, Milestone Birthdays, and Community Summits.
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 340)">
      <!-- Badge 1: Dual-Engine AI -->
      <rect x="0" y="0" width="225" height="48" rx="14" fill="#1a1929" stroke="#f6c177" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="20" y="30" fill="#f6c177" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡ Dual-Engine Hybrid AI</text>

      <!-- Badge 2: Budget Rebalancing -->
      <rect x="245" y="0" width="235" height="48" rx="14" fill="#1a1929" stroke="#c4a7e7" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="265" y="30" fill="#c4a7e7" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚖️ Dynamic Rebalancing</text>

      <!-- Badge 3: Day-Of Run-of-Show -->
      <rect x="500" y="0" width="225" height="48" rx="14" fill="#1a1929" stroke="#9ccfd8" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="520" y="30" fill="#9ccfd8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⏱️ Day-Of Run-of-Show</text>

      <!-- Badge 4: WCAG AAA -->
      <rect x="745" y="0" width="235" height="48" rx="14" fill="#1a1929" stroke="#56d67e" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="765" y="30" fill="#56d67e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🛡️ WCAG 2.1 AAA Compliant</text>
    </g>
  </g>

  <!-- Bottom Brand Footer Line -->
  <g transform="translate(100, 565)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#2e2b45" stroke-width="1.5"/>
    <text x="0" y="32" fill="#6e6a86" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      Built for the Celebration &amp; Event Planning AI Challenge · Zero-Latency Offline Fallback · Strict TypeScript 5
    </text>
    <text x="1000" y="32" text-anchor="end" fill="#f6c177" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      vesta-event-studio.vercel.app
    </text>
  </g>
</svg>
